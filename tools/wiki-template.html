<!doctype html>
<!-- 생성물: tools/build-rules.py가 {{SOURCE}}에서 만든 파일입니다. 직접 수정하지 말고 원본 Markdown을 고치세요. -->
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<style>
:root{
  --bg:#f5f6f7; --panel:#fff; --panel-2:#f8f9fa; --text:#202122; --muted:#72777d;
  --line:#d9dde1; --line-strong:#b9bec4; --accent:#00a495; --accent-2:#007c70;
  --link:#0275d8; --danger:#d33; --warn:#b26a00; --ok:#14866d; --code:#eef1f3;
  --shadow:0 2px 10px rgba(0,0,0,.08); --header-h:56px; --sidebar-w:285px;
}
[data-theme="dark"]{
  --bg:#181a1b; --panel:#222426; --panel-2:#292c2f; --text:#e8eaed; --muted:#a9b0b6;
  --line:#3b4045; --line-strong:#555c62; --accent:#28c6b6; --accent-2:#50ddce;
  --link:#7ab8ff; --danger:#ff6b6b; --warn:#f0b45d; --ok:#57d2b1; --code:#303438;
  --shadow:0 2px 14px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Roboto,Arial,sans-serif;line-height:1.72}
a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
button,input{font:inherit}
.topbar{position:sticky;top:0;z-index:1000;height:var(--header-h);display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.brand{font-weight:800;white-space:nowrap;letter-spacing:-.02em}.brand small{font-weight:600;color:var(--muted);margin-left:6px}
.spacer{flex:1}.toolbar{display:flex;align-items:center;gap:8px}
.icon-btn{border:1px solid var(--line-strong);background:var(--panel-2);color:var(--text);border-radius:6px;min-width:40px;height:38px;padding:0 11px;cursor:pointer;font-weight:800}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-2)}
.menu-btn{display:none;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:900;text-shadow:0 1px 1px rgba(0,0,0,.28)}
.menu-btn:hover{color:#fff;background:var(--accent-2)}
.search-wrap{position:relative;max-width:520px;flex:1}.search-wrap input{width:100%;height:38px;border:1px solid var(--line-strong);background:var(--panel);color:var(--text);border-radius:6px;padding:0 36px 0 12px;outline:none}.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
.search-count{position:absolute;right:9px;top:8px;color:var(--muted);font-size:12px;font-weight:700}
.layout{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);max-width:1480px;margin:0 auto}
.sidebar{position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));overflow:auto;padding:20px 14px 32px;border-right:1px solid var(--line);background:var(--panel)}
.toc-title{font-size:13px;color:var(--muted);font-weight:800;margin:0 8px 10px;text-transform:uppercase;letter-spacing:.08em}
.toc{list-style:none;padding:0;margin:0}.toc li{margin:2px 0}.toc a{display:block;padding:7px 9px;border-radius:5px;color:var(--text);font-size:14px;line-height:1.4}.toc a:hover{background:var(--panel-2);text-decoration:none}.toc a.active{background:color-mix(in srgb,var(--accent) 14%,var(--panel));color:var(--accent-2);font-weight:800}.toc .sub a{padding-left:24px;font-size:13px;color:var(--muted)}
.main{min-width:0;padding:28px 34px 80px}.doc{max-width:1040px;margin:0 auto;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:34px 42px 58px}
.doc-header{border-bottom:2px solid var(--line-strong);padding-bottom:20px;margin-bottom:28px}.doc-header h1{font-size:34px;line-height:1.2;margin:0 0 10px;letter-spacing:-.04em}.subtitle{color:var(--muted);margin:0 0 16px}.meta{display:flex;gap:7px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;color:var(--muted)}.badge.core{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--accent-2);background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.notice{margin:18px 0;padding:14px 16px;border-left:4px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--panel));border-radius:0 6px 6px 0}.notice strong{color:var(--accent-2)}
.section{margin-top:42px}.section.filtered-out{display:none}.section h2{font-size:25px;margin:0 0 16px;padding-bottom:8px;border-bottom:1px solid var(--line);letter-spacing:-.025em}.section h3{font-size:19px;margin:28px 0 10px;letter-spacing:-.02em}.anchor-no{color:var(--muted);font-weight:500;margin-right:8px}
p{margin:10px 0} ul,ol{padding-left:25px} li{margin:4px 0}.tight li{margin:2px 0}
.rule{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:15px 17px;margin:14px 0}.rule-title{font-weight:900;margin-bottom:5px}.rule.core{border-left:4px solid var(--accent)}
blockquote{margin:16px 0;padding:12px 16px;border-left:4px solid var(--line-strong);background:var(--panel-2);color:var(--text)}
code,kbd{background:var(--code);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:.92em}pre{overflow:auto;background:var(--code);border:1px solid var(--line);padding:14px;border-radius:6px;line-height:1.5}
.table-wrap{overflow:auto;margin:14px 0 20px;border:1px solid var(--line);border-radius:6px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top;text-align:left}th:last-child,td:last-child{border-right:0}tr:last-child td{border-bottom:0}th{background:var(--panel-2);font-weight:800}td:first-child{font-weight:700}
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:14px 0}.flow span{border:1px solid var(--line);background:var(--panel-2);padding:6px 10px;border-radius:5px;font-weight:700}.flow b{color:var(--muted)}
.kicker{font-size:12px;font-weight:900;color:var(--accent-2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}.muted{color:var(--muted)}.danger{color:var(--danger);font-weight:800}.ok{color:var(--ok);font-weight:800}
mark{background:#ffe477;color:#1d1d1d;border-radius:2px;padding:0 1px}
.backtop{position:fixed;right:20px;bottom:20px;z-index:800;border:1px solid var(--line-strong);background:var(--panel);color:var(--text);width:42px;height:42px;border-radius:50%;box-shadow:var(--shadow);cursor:pointer;font-weight:900}
.overlay{display:none}
.no-results{display:none;padding:24px;border:1px dashed var(--line-strong);border-radius:7px;text-align:center;color:var(--muted);margin-top:20px}
.no-results.show{display:block}
.footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
@media(max-width:900px){
  :root{--header-h:58px}.topbar{padding:0 10px}.brand small{display:none}.search-wrap{max-width:none}.menu-btn{display:inline-flex;align-items:center;justify-content:center;min-width:52px;color:#fff !important;background:var(--accent) !important;border-color:var(--accent) !important}
  .layout{display:block}.sidebar{position:fixed;left:0;top:var(--header-h);z-index:1200;width:min(86vw,320px);height:calc(100vh - var(--header-h));transform:translateX(-105%);transition:transform .2s ease;box-shadow:var(--shadow);border-right:1px solid var(--line)}
  .sidebar.open{transform:translateX(0)}.overlay{position:fixed;display:block;inset:var(--header-h) 0 0 0;background:rgba(0,0,0,.45);z-index:1100;opacity:0;pointer-events:none;transition:opacity .2s}.overlay.open{opacity:1;pointer-events:auto}
  .main{padding:14px}.doc{padding:25px 18px 45px}.doc-header h1{font-size:28px}.section h2{font-size:22px}.section h3{font-size:18px}.toolbar .theme-label{display:none}
}
@media(max-width:560px){.brand{font-size:14px}.search-wrap input{padding-left:9px}.search-count{display:none}.icon-btn{min-width:38px;padding:0 8px}.menu-btn{min-width:48px}.doc{border-left:0;border-right:0}.main{padding:10px 0}.doc-header h1{font-size:25px}}
@media print{.topbar,.sidebar,.backtop,.overlay{display:none!important}.layout{display:block}.main{padding:0}.doc{border:0;box-shadow:none;max-width:none;padding:0}.section{break-inside:avoid-page}a{color:inherit;text-decoration:none}}

/* --- build-rules.py 추가 스타일 --- */
pre code{display:block;border:0;padding:0;background:transparent;font-size:.92em}
.pages-title{font-size:13px;color:var(--muted);font-weight:800;margin:0 8px 8px;text-transform:uppercase;letter-spacing:.08em}
.pages{list-style:none;padding:0;margin:0 0 18px}.pages li{margin:2px 0}.pages a{display:block;padding:7px 9px;border-radius:5px;color:var(--text);font-size:14px}.pages a:hover{background:var(--panel-2);text-decoration:none}.pages a.current{background:color-mix(in srgb,var(--accent) 14%,var(--panel));color:var(--accent-2);font-weight:800}
.section h4{font-size:16px;margin:22px 0 8px}
li.rule-line{list-style:none;margin:10px 0 10px -25px;padding:10px 14px;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--panel-2);border-radius:6px}
li.rule-line .rule-id{display:inline-block;font-family:"SFMono-Regular",Consolas,monospace;font-size:12px;font-weight:800;color:var(--accent-2);margin-right:8px}
li.rule-line .rule-priority{display:inline-block;font-size:11px;font-weight:800;border:1px solid var(--line-strong);border-radius:999px;padding:0 7px;margin-right:8px;color:var(--muted)}
li.rule-line[data-priority="P0"] .rule-priority{border-color:var(--danger);color:var(--danger)}
li.rule-line[data-priority="P1"] .rule-priority{border-color:var(--warn);color:var(--warn)}
li.rule-line .needs-criteria{color:var(--warn);font-weight:800;font-size:12px;margin-left:6px}
li.rule-line a.rule-detail{font-size:12px;margin-left:6px}
.example{border:1px solid var(--line);border-radius:7px;margin:14px 0;overflow:hidden}.example-title{font-weight:900;padding:7px 12px;font-size:13px}.example pre{margin:0;border:0;border-radius:0}
.example.bad{border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}.example.bad .example-title{color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,var(--panel))}
.example.good{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}.example.good .example-title{color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--panel))}
.meta-line{color:var(--muted);font-size:13px;margin:-4px 0 10px}
.toc .sub2 a{padding-left:38px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="목차 열기">목차</button>
  <div class="brand">{{TITLE}} <small>{{BRAND_SMALL}}</small></div>
  <div class="spacer"></div>
  <div class="search-wrap"><input id="search" type="search" placeholder="{{SEARCH_PLACEHOLDER}}" autocomplete="off"/><span id="searchCount" class="search-count"></span></div>
  <div class="toolbar"><button class="icon-btn" id="themeBtn" title="다크모드 전환"><span class="theme-label">테마</span> ◐</button></div>
</header>
<div class="overlay" id="overlay"></div>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="pages-title">문서</div>
    <ul class="pages">
{{PAGES}}
    </ul>
    <div class="toc-title">목차</div>
    <ul class="toc" id="toc">
{{TOC}}
    </ul>
  </aside>
  <main class="main">
    <article class="doc" id="doc">
      <header class="doc-header">
        <div class="kicker">{{KICKER}}</div>
        <h1>{{TITLE}}</h1>
        <p class="subtitle">{{SUBTITLE}}</p>
        <div class="meta">{{BADGES}}</div>
      </header>
{{BODY}}
      <div id="noResults" class="no-results">검색어와 일치하는 절이 없습니다.</div>
      <footer class="footer">{{FOOTER}} · <a href="{{SOURCE_URL}}">원본 Markdown</a></footer>
    </article>
  </main>
</div>
<button class="backtop" id="backtop" title="맨 위로">↑</button>
<script>
(() => {
  const root = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  const saved = localStorage.getItem('bloomRulesTheme');
  if (saved) root.dataset.theme = saved;
  else if (matchMedia('(prefers-color-scheme: dark)').matches) root.dataset.theme = 'dark';
  themeBtn.addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    localStorage.setItem('bloomRulesTheme', next);
  });

  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const menuBtn = document.getElementById('menuBtn');
  const closeMenu = () => { sidebar.classList.remove('open'); overlay.classList.remove('open'); };
  menuBtn.addEventListener('click', () => { sidebar.classList.toggle('open'); overlay.classList.toggle('open'); });
  overlay.addEventListener('click', closeMenu);
  document.querySelectorAll('.toc a').forEach(a => a.addEventListener('click', closeMenu));

  document.getElementById('backtop').addEventListener('click', () => scrollTo({top:0,behavior:'smooth'}));

  const links = [...document.querySelectorAll('.toc a')];
  const anchorId = a => decodeURIComponent(new URL(a.href, location.href).hash.slice(1));
  const targets = links.map(a => document.getElementById(anchorId(a))).filter(Boolean);
  const observer = new IntersectionObserver(entries => {
    const visible = entries.filter(e => e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];
    if (!visible) return;
    links.forEach(a => a.classList.toggle('active', anchorId(a) === visible.target.id));
  }, {rootMargin:'-70px 0px -72% 0px',threshold:[0,1]});
  targets.forEach(t => observer.observe(t));

  const search = document.getElementById('search');
  const count = document.getElementById('searchCount');
  const sections = [...document.querySelectorAll('[data-search]')];
  const noResults = document.getElementById('noResults');
  const normalize = s => s.toLowerCase().replace(/\s+/g,' ').trim();
  const runSearch = () => {
    const q = normalize(search.value);
    let shown = 0;
    sections.forEach(sec => {
      const hit = !q || normalize(sec.textContent).includes(q);
      sec.classList.toggle('filtered-out', !hit);
      if (hit) shown++;
    });
    count.textContent = q ? `${shown}/${sections.length}` : '';
    noResults.classList.toggle('show', !!q && shown === 0);
  };
  search.addEventListener('input', runSearch);
  search.addEventListener('keydown', e => { if (e.key === 'Escape') { search.value=''; runSearch(); search.blur(); } });
  addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='k') { e.preventDefault(); search.focus(); search.select(); } });
})();
</script>
</body>
</html>
