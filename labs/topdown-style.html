<body>
<header>
 <div class="heading"><div><div class="eyebrow">공통 세계관 · 시각 연구 09 · 손뜨개 경계</div><h1>그림체 실험실</h1><p class="sub">예제 2종 × 그림체 9종</p></div><div class="tools"><button id="compare" aria-pressed="false">9종 비교<kbd>C</kbd></button><button id="pause" aria-pressed="false">정지<kbd>P</kbd></button><button id="restart">다시<kbd>R</kbd></button></div></div>

   <label for="edgeStrength">외곽 <input id="edgeStrength" type="range" min="0" max="1.6" step="0.1" value="1" aria-label="손뜨개 외곽 강도"><output id="edgeValue">100%</output></label>
   <label class="fiber-label"><input id="fiberToggle" type="checkbox" checked>보풀</label>

<footer><div id="styleInfo"></div><div class="guide" id="guide"></div></footer>
<script>
/*
 * Style Lab v9 — v5 gameplay, original eight styles and exact top-down shapes retained.
 * Adds a shared procedural knitted material and a geometry/knit A-B comparison.
 * No RALLY assets or gameplay is replaced; this is an independent reference lab.
 * Incorrect humanoid Bloom interpretation removed. Top-down has independent X/Y simulation.
 * Retains all 8 original styles and adds a ninth. No image assets, texture sampling, or dependencies.
 * Sketch reference: procedural_sketch_vfx_refined_456.html from '세계관 만들기'.
 * Its strokeLine / scribbleCircle / sketchArc and eight-Hz redraw vocabulary are
 * ported below; alpha is multiplicative so enclosing fades remain correct.
 * Foot-anchored two-link IK follows the reference. Simulation and rendering are
 * separate: every style consumes identical poses and FX events; render never
 * updates gameplay, RNG, HP, transforms, hitboxes, or FX age.
 * Canvas vectors only. Organic uses a smooth capsule field + marching squares,
 * not a texture masquerading as a code-generated asset.
 */
/* v9: corrected whole-contour fibres, real scalloped fills, cached local yarn geometry,
 * alpha-safe fibre fades, normalized hand/foot knots and edge comparison controls.
 * Original nine styles, both simulations, unit silhouettes and controls are preserved. */
(()=>{'use strict';
const $=id=>document.getElementById(id), canvas=$('game'),ctx=canvas.getContext('2d',{alpha:false});
const STYLES=[
 {id:'geometric',name:'도형',desc:'단색 도형 · 매끈한 선 · 독립된 관절'},
 {id:'sketch',name:'스케치',desc:'참고 원본의 가는 겹선 · 비정형 원 · 8fps 재묘화'},
 {id:'silhouette',name:'실루엣',desc:'내부 정보 없는 검은 면 · 음영층 · 칼날 같은 여백'},
 {id:'ink',name:'잉크·만화',desc:'펜 굵기 대비 · 흰 내부와 검은 그림자 · 집중선'},
 {id:'cel',name:'셀셰이딩',desc:'색 있는 면 · 경계가 뚜렷한 3단계 명암'},
 {id:'organic',name:'유기체',desc:'서로 합쳐지는 액체 외곽 · 탄성 · 분리되는 방울'},
 {id:'glitch',name:'글리치',desc:'형체의 가로 조각 이동 · 색 채널 분리 · 스캔라인'},
 {id:'neon',name:'네온',desc:'어두운 바탕 · 발광 윤곽 · 겹치는 빛과 잔상'},
 {id:'knit',name:'뜨개',desc:'울퉁불퉁한 실코 경계 · 촘촘한 보풀 · 교차 솔기'}
];
const EXAMPLES=[
 {id:'stickman',name:'스틱맨 · 횡스크롤',desc:'2D 본 · 중력 · 점프 전투'},
 {id:'topdown',name:'블룸 · 탑다운',desc:'렐리 프론티어 유닛 · 상면 시점 · 평면 전투'}
];
const CFG={width:1150,floor:420,dt:1/120,gravity:1900,speed:270,jump:-650,attackDuration:.28,attackCooldown:.39,damage:35,reach:105,lightningCooldown:.82};
const keys=new Set(),pressed=new Set(),hold={left:false,right:false,up:false,down:false,jump:false,attack:false,lightning:false};
let W=1,H=1,DPR=1,styleId='sketch',exampleId='stickman',paused=false,compare=false,compareMode='all',sketchFrame=0,acc=0,last=performance.now(),world,nextID=0,camX=0,scale=1,baseY=0;
let reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)}
function h2(x,y,s=0){return hash(x*12.9898+y*78.233+s*37.719)}
function rand(){let n=world.rng|0;n^=n<<13;n^=n>>>17;n^=n<<5;world.rng=n>>>0;return (world.rng>>>0)/4294967296}
function actor(x,enemy=false,kind=0){const id=++nextID;return{id,seed:id*137.3,x,px:x,y:CFG.floor,py:CFG.floor,vx:0,vy:0,onGround:true,facing:enemy?-1:1,enemy,kind,hp:enemy?(kind?90:70):100,maxHp:enemy?(kind?90:70):100,attackT:0,attackCd:0,serial:0,lastHitSerial:-1,attackLanded:false,hitT:0,stun:0,dead:false,deathT:0,phase:0,lightningCd:0,telegraph:0,trail:[],trailClock:0};}
function reset(){nextID=0;world={time:0,tick:0,rng:93765,player:actor(220),enemies:[actor(395,true,0),actor(670,true,1)],fx:[],particles:[],kills:0,shake:0};clearInput();acc=0;$('end').hidden=true;syncHUD();}
function clearInput(){keys.clear();pressed.clear();for(const k in hold)hold[k]=false;document.querySelectorAll('.held').forEach(b=>b.classList.remove('held'))}
function updateInfo(){const s=STYLES.find(s=>s.id===styleId),top=exampleId==='topdown',unit=td?TD_TYPES.find(t=>t.id===td.player.type):null;$('styleInfo').innerHTML='<b>'+(top?(unit?unit.name:'블룸 탑다운'):'스틱맨')+' · '+s.name+'</b><span>'+(top&&styleId==='geometric'?'원형 코어 · 칼잎 / 포자낭 / 껍질':s.desc)+'</span>';$('guide').innerHTML=top?'<b>WASD / 방향키</b> 평면 이동 · 마우스 조준 · <b>J</b> '+(unit?unit.hint.replace('J ',''):'공격')+' · <b>K</b> 번개<br><b>1–9</b> 그림체 · <b>Q / E</b> 예제 · <b>P</b> 정지 · <b>C</b> 9종 비교':'<b>A/D</b> 이동 · <b>W/Space</b> 점프 · <b>J</b> 공격 · <b>K</b> 번개<br><b>1–9</b> 그림체 · <b>Q / E</b> 예제 · <b>P</b> 정지 · <b>C</b> 9종 비교'}
function setStyle(id){if(!STYLES.some(s=>s.id===id))return;styleId=id;for(const b of $('tabs').children){const active=b.dataset.style===id;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1}updateInfo();syncMaterialUI();render()}
function setExample(id){if(!EXAMPLES.some(e=>e.id===id))return;exampleId=id;clearInput();acc=0;tdPointer.active=false;document.body.classList.toggle('topdown',id==='topdown');for(const b of $('exampleTabs').children){const active=b.dataset.example===id;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1}updateInfo();resize();syncHUD()}
function setPause(value){paused=Boolean(value);acc=0;clearInput();document.body.classList.toggle('paused',paused);$('pause').setAttribute('aria-pressed',String(paused));$('pause').innerHTML=(paused?'계속':'정지')+'<kbd>P</kbd>';render()}
function syncMaterialUI(){
 $('knitSettings').classList.toggle('visible',styleId==='knit'||compare);
 $('knitCompare').setAttribute('aria-pressed',String(compare&&compareMode==='pair'));
 $('edgeCompare').setAttribute('aria-pressed',String(compare&&compareMode==='edge'));
 $('zoomDetail').setAttribute('aria-pressed',String(KNIT_CONFIG.view.enlarged));
 $('zoomDetail').textContent=KNIT_CONFIG.view.enlarged?'원래 크기':'확대 보기';
}
function setCompare(value,mode='all'){
 compare=Boolean(value);compareMode=['pair','edge'].includes(mode)?mode:'all';clearInput();tdPointer.active=false;
 document.body.classList.toggle('comparing',compare);
 $('compare').setAttribute('aria-pressed',String(compare&&compareMode==='all'));
 $('compare').innerHTML=(compare&&compareMode==='all'?'한 화면':STYLES.length+'종 비교')+'<kbd>C</kbd>';
 syncMaterialUI();render();syncHUD();
}
function setZoom(value){KNIT_CONFIG.view.enlarged=Boolean(value);tdPointer.active=false;syncMaterialUI();render()}
function setStitchSize(value){
 const n=Number(value);if(!Number.isFinite(n))return;
 KNIT_CONFIG.stitch.size=Math.round(clamp(n,.75,1.5)*20)/20;knitCache.clear();knitContourCache.clear();

function renderStyleComparison(topdown){

 for(let i=0;i<ids.length;i++){
  const id=ids[i],st=STYLES.find(s=>s.id===id),x=pad+i%cols*(cw+gap),y=pad+Math.floor(i/cols)*(ch+gap),bar=ch<130?24:29;

   }else{

    const foot=y+ch-10,ox=x+cw*.42-world.player.x*ss,oy=foot-CFG.floor*ss;

   }
   ctx.fillStyle=id==='neon'?'#102330':id==='knit'?'#f5eddc':'#f7faf3';ctx.fillRect(x,y,cw,bar);
   ctx.fillStyle=id==='neon'?'#c5e6dc':id==='knit'?'#806a43':'#52655a';ctx.textAlign='left';ctx.font='700 '+(W<600?10:12)+'px system-ui';

    const note=compareMode==='edge'?(i?'실코 요철 + 보풀 · 현재 설정':'외곽 효과 0 · 같은 뜨개 표면'):(id==='knit'?'실코 경계 · 촘촘한 보풀':'기준 도형 · 같은 게임 상태');
    ctx.fillText(note,x+cw-12,y+bar*.67);
   }
  }finally{knitEdgeOverride=saved;ctx.restore()}

 }
}
