<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>스케치 전투 · 동작과 실루엣 개선</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f3f0e7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;left:12px;top:12px;z-index:3;background:rgba(255,255,255,.76);border:1px solid rgba(0,0,0,.15);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.5;max-width:390px}.hud b{font-size:13px}.status{margin-top:4px;font-weight:700}
.buttons{position:fixed;right:12px;bottom:14px;z-index:4;display:grid;grid-template-columns:repeat(2,86px);gap:8px}button{height:44px;border-radius:12px;border:1px solid rgba(0,0,0,.2);background:rgba(255,255,255,.84);font-weight:700}.joy{position:fixed;left:20px;bottom:20px;width:118px;height:118px;border-radius:50%;border:2px solid rgba(0,0,0,.18);z-index:4;touch-action:none}.knob{position:absolute;left:39px;top:39px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.16);border:2px solid rgba(0,0,0,.24)}
@media (pointer:fine){.joy{opacity:.36}.buttons{bottom:12px}}

.inspect{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.inspect button{height:30px;font:600 11px system-ui;padding:0 9px;border-radius:7px;cursor:pointer}.inspect button[aria-pressed="true"]{background:#222;color:#fff}
.fxbar{position:fixed;z-index:4;bottom:25px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.fxbar button{height:46px;padding:0 16px;cursor:pointer;background:#faf8f0;border-radius:9px;font:650 13px system-ui;box-shadow:0 2px 0 #bdb9ad}.fxbar kbd{display:inline-block;margin-right:7px;font:600 12px system-ui;border-right:1px solid #c8c3b5;padding-right:8px;color:#777}
button{touch-action:manipulation;color:#242320;-webkit-tap-highlight-color:transparent}button:active{transform:translateY(1px);background:#e8e3d6}button:focus-visible{outline:2px solid #756444;outline-offset:2px}
@media(max-width:700px){.hud{left:8px;top:8px;padding:8px 10px;max-width:calc(100vw - 38px);font-size:10px;line-height:1.45}.hud b{font-size:12px}.fxbar{top:194px;bottom:auto;left:8px;right:8px;transform:none;justify-content:flex-start;gap:6px}.fxbar button{height:36px;padding:0 11px;font-size:11px}.fxbar kbd{margin-right:4px;padding-right:5px}.joy{width:98px;height:98px;left:16px;bottom:14px}.knob{left:29px;top:29px}.buttons{grid-template-columns:repeat(2,65px);bottom:14px;right:12px;gap:6px}.buttons button{height:39px;font-size:11px}}
@media(max-height:500px){.hud{font-size:9px;line-height:1.3}.hud span{display:none}.fxbar{top:auto;bottom:12px;left:45%;right:auto;transform:translateX(-50%)}.fxbar button{height:32px;padding:0 9px}.joy{width:84px;height:84px;bottom:10px}.knob{left:22px;top:22px}.buttons button{height:32px}.buttons{grid-template-columns:repeat(2,58px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><b>스케치 전투 · 시각 개선 02</b><br>A/D · ←/→ 이동 · W/Space/↑ 점프<br>J 공격 · K 번개 · 1 폭발 · 2 연기 · 3 오라<br>4 베기 · 5 지면 충격파 · 6 지면 파열 · 7 보호막 · 8 회복 · 9 투사체<br><span>이미지·텍스처 0 · 손그림 선 + 본 애니메이션</span><div class="status" id="status"></div><div class="inspect"><button id="slow" aria-pressed="false">느리게 0.25×</button><button id="pause" aria-pressed="false">일시정지</button><button id="practice" aria-pressed="false">몹 숨기기</button><button id="reset">다시 시작</button></div></div>
<div class="joy" id="joy"><div class="knob" id="knob"></div></div>
<div class="fxbar"><button data-act="slash"><kbd>4</kbd>베기</button><button data-act="shockwave"><kbd>5</kbd>충격파</button><button data-act="crack"><kbd>6</kbd>지면 파열</button></div>
<div class="buttons"><button data-act="jump">점프</button><button data-act="attack">공격</button><button data-act="lightning">번개</button><button data-act="aura">오라</button></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false}),statusEl=document.getElementById('status');
let W=0,H=0,DPR=1,groundY=0,last=performance.now(),t=0,sketchFrame=0,spawnClock=0;
const keys=new Set(),fx=[],enemies=[];
const view={timeScale:1,paused:false,practice:false};
const CFG={slash:{windup:.10,duration:.44,activeEnd:.23,reach:103},shockwave:{windup:.15,duration:.52,range:198,travel:.58},fracture:{windup:.19,duration:.6,life:2.8}};
let effectSerial=0,enemySerial=0;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const mix=(a,b,u)=>a+(b-a)*u;
const smooth=(a,b,v)=>{const u=clamp((v-a)/(b-a));return u*u*(3-2*u)};
const easeOut=u=>1-(1-clamp(u))**3;

const player={x:180,y:0,vx:0,vy:0,dir:1,onGround:true,hp:100,maxHp:100,attackT:0,attackSerial:0,aura:false,shield:false,walkT:0,action:null,pendingGround:null};
let joyVec={x:0,y:0},joyActive=false;
function resize(){
  const oldGround=groundY;DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);groundY=H*.79;
  const dy=groundY-oldGround;
  if(!oldGround)player.y=groundY;else{player.y=player.onGround?groundY:Math.min(player.y+dy,groundY);for(const mob of enemies)mob.y+=dy;for(const e of fx){e.y+=dy;if(e.ty!=null)e.ty+=dy}}
  player.x=Math.max(28,Math.min(W-28,player.x));
}
addEventListener('resize',resize);resize();
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)}
function h2(x,y,s=0){return hash(x*12.9898+y*78.233+s*37.719)}
function jitter(seed,a=1.2){return[(h2(seed,sketchFrame,1)-.5)*a,(h2(seed+7.3,sketchFrame,2)-.5)*a]}
function strokeLine(x1,y1,x2,y2,o={}){const passes=o.passes??2,w=o.width??1.7,wb=o.wobble??1.7;ctx.save();ctx.globalAlpha*=clamp(o.alpha??1);ctx.strokeStyle=o.color||'#171717';ctx.lineCap='round';ctx.lineJoin='round';for(let p=0;p<passes;p++){const[a,b]=jitter((o.seed||0)+p*13.7,wb),[c,d]=jitter((o.seed||0)+p*23.1+4,wb);ctx.lineWidth=w*(.85+h2(p,sketchFrame,o.seed||0)*.35);ctx.beginPath();ctx.moveTo(x1+a,y1+b);const mx=(x1+x2)/2,my=(y1+y2)/2,nx=-(y2-y1),ny=x2-x1,L=Math.hypot(nx,ny)||1,bend=(h2(o.seed||0,p,sketchFrame)-.5)*wb*2;ctx.quadraticCurveTo(mx+nx/L*bend,my+ny/L*bend,x2+c,y2+d);ctx.stroke()}ctx.restore()}
function scribbleCircle(x,y,r,o={}){ctx.save();ctx.strokeStyle=o.color||'#171717';ctx.globalAlpha*=clamp(o.alpha??1);ctx.lineCap='round';const loops=o.loops??2,seg=o.seg??40;for(let l=0;l<loops;l++){ctx.lineWidth=(o.width??1.4)*(.9+h2(l,sketchFrame,o.seed||0)*.25);ctx.beginPath();for(let i=0;i<=seg;i++){const a=i/seg*Math.PI*2,n=Math.sin(a*5+(o.seed||0)+l)*.018+Math.sin(a*11+sketchFrame*.9+l)*.010,rr=r*(1+n)+(h2(i,l,sketchFrame)-.5)*(o.wobble??1.1),px=x+Math.cos(a)*rr+(h2(i,sketchFrame,l)-.5)*.6,py=y+Math.sin(a)*rr+(h2(i+9,sketchFrame,l)-.5)*.6;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke()}ctx.restore()}
function hatchRect(x,y,w,h,d=.5,angle=.7,o={}){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();const sp=10-d*6,L=Math.hypot(w,h)*1.5,cx=x+w/2,cy=y+h/2,ca=Math.cos(angle),sa=Math.sin(angle);for(let q=-L;q<L;q+=sp){const ox=-sa*q,oy=ca*q;strokeLine(cx+ox-ca*L,cy+oy-sa*L,cx+ox+ca*L,cy+oy+sa*L,{width:.5,wobble:.7,passes:1,alpha:.12+.17*d,seed:q*.13+(o.seed||0)})}ctx.restore()}
function burst(x,y,count=10,scale=1,alpha=1){for(let i=0;i<count;i++){const a=i/count*Math.PI*2+h2(i,sketchFrame,4)*.18,len=(20+h2(i,9,3)*40)*scale;strokeLine(x+Math.cos(a)*7,y+Math.sin(a)*7,x+Math.cos(a)*len,y+Math.sin(a)*len,{width:1+1.5*h2(i,2,1),wobble:2,passes:2,alpha,seed:i*17.1+sketchFrame})}}

function sketchArc(cx,cy,r,a0,a1,o={}){
  const seg=o.seg??18;
  let prev=null;
  for(let i=0;i<=seg;i++){
    const u=i/seg,a=a0+(a1-a0)*u;
    const rr=r+(h2(i,o.seed||0,sketchFrame)-.5)*(o.wobble??3);
    const p={x:cx+Math.cos(a)*rr,y:cy+Math.sin(a)*rr};
    if(prev)strokeLine(prev.x,prev.y,p.x,p.y,{width:o.width??1.8,wobble:o.lineWobble??1.2,passes:o.passes??2,alpha:o.alpha??1,seed:(o.seed||0)+i,color:o.color});
    prev=p;
  }
}
function sketchPath(points,o={}){
  if(points.length<2)return;
  ctx.save();ctx.globalAlpha*=clamp(o.alpha??1);ctx.strokeStyle=o.color||'#24211d';ctx.lineCap='round';ctx.lineJoin='round';
  const passes=o.passes??2;
  for(let pass=0;pass<passes;pass++){
    ctx.beginPath();ctx.lineWidth=(o.width??1.2)*(1+pass*.10);
    for(let i=0;i<points.length;i++){
      const j=jitter((o.seed??0)+i*2.13+pass*67,o.wobble??.7),p=points[i];
      const x=p.x+j[0],y=p.y+j[1];i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    if(o.closed)ctx.closePath();ctx.stroke();
  }ctx.restore();
}
function quadratic(p0,p1,p2,n=24){const pts=[];for(let i=0;i<=n;i++){const u=i/n,v=1-u;pts.push({x:v*v*p0.x+2*v*u*p1.x+u*u*p2.x,y:v*v*p0.y+2*v*u*p1.y+u*u*p2.y})}return pts}
function polygon(pts,fill='#f3f0e7',alpha=1){if(pts.length<3)return;ctx.save();ctx.globalAlpha*=clamp(alpha);ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.restore()}
function pencilRibbon(pts,width,o={}){
  if(pts.length<3)return;
  const left=[],right=[],normals=[];
  for(let i=0;i<pts.length;i++){
    const p=pts[i],a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)],dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;
    const nx=-dy/L,ny=dx/L,u=i/(pts.length-1),w=typeof width==='function'?width(u):width;
    const grain=.85+.25*h2(i,o.seed??0,sketchFrame);
    const r=Math.max(.15,w*grain/2);left.push({x:p.x+nx*r,y:p.y+ny*r});right.push({x:p.x-nx*r,y:p.y-ny*r});normals.push({x:nx,y:ny,r});
  }
  ctx.save();ctx.globalAlpha*=clamp(o.alpha??1);
  polygon(left.concat([...right].reverse()),o.color||'#24211d');
  sketchPath(left,{width:.65,passes:1,wobble:.7,seed:o.seed});sketchPath(right,{width:.55,passes:1,wobble:.7,seed:(o.seed??0)+41});
  // Dry graphite streaks: actual vector strokes, no offscreen images or patterns.
  for(let k=0;k<3;k++){
    const a=3+k*3,b=pts.length-3-k*2;if(b<=a)continue;
    const trace=[];for(let i=a;i<b;i++){const p=pts[i],n=normals[i],s=(k-1)*.44+.12*Math.sin(i*.9+k);trace.push({x:p.x+n.x*n.r*s,y:p.y+n.y*n.r*s})}
    sketchPath(trace,{color:'#f3f0e7',width:.45+k*.13,alpha:.5,passes:1,wobble:.20,seed:(o.seed??0)+100+k});
  }ctx.restore();
}
function inkChip(x,y,size,rotation,alpha=1,seed=0){
  const pts=[[-.8,-.3],[-.15,-.7],[.85,-.12],[.45,.5],[-.5,.42]].map(([px,py])=>({x:x+(px*Math.cos(rotation)-py*Math.sin(rotation))*size,y:y+(px*Math.sin(rotation)+py*Math.cos(rotation))*size}));
  ctx.save();ctx.globalAlpha*=clamp(alpha);polygon(pts);sketchPath(pts,{closed:true,width:1,seed,wobble:.5});
  sketchPath([pts[0],pts[3]],{width:.7,passes:1,alpha:.45,seed:seed+1});ctx.restore();
}
function fractureGeometry(seed,small=false){
  const scale=small?.46:1,main=[{x:0,y:1},{x:15,y:7},{x:31,y:4},{x:47,y:14},{x:64,y:10},{x:83,y:18},{x:101,y:12},{x:122,y:16},{x:146,y:8},{x:173,y:3}].map((p,i)=>({x:p.x*scale,y:(p.y+(h2(i,seed,3)-.5)*4)*scale}));
  const branches=[];
  for(const [j,k] of [2,4,7].entries()){
    const p=main[k],sign=j===1?-1:1,length=[27,42,23][j]*scale;
    const branch=[p,{x:p.x+sign*(7+j*2)*scale,y:p.y+length*.35},{x:p.x+sign*(2-j*4)*scale,y:p.y+length*.72},{x:p.x+sign*(13+j*3)*scale,y:p.y+length}];
    branches.push(branch);
  }
  const back=[{x:0,y:1},{x:-13*scale,y:8*scale},{x:-24*scale,y:4*scale},{x:-37*scale,y:12*scale}];
  const plates=[{x:10,w:31,h:11,base:9},{x:54,w:43,h:13,base:16},{x:117,w:32,h:8,base:16}].map((p,k)=>{
    const x=p.x*scale,w=p.w*scale,h=p.h*scale,base=p.base*scale;
    return {x,points:[{x:x-w*.54,y:base-h*.22},{x:x-w*.36,y:base-h*(.70+k*.10)},{x:x+w*.04,y:base-h},{x:x+w*.5,y:base-h*.57},{x:x+w*.36,y:base+.7*scale},{x:x-w*.32,y:base+2*scale}]};
  });
  return{main,branches,back,plates,scale};
}
function spawnDust(x,y,dir=0){spawnFX('dust',x,y,{dir})}
function beginAction(kind){
  if(player.action)return false;
  if(kind!=='slash'&&!player.onGround){player.pendingGround=kind;player.vy=Math.max(player.vy,360);return false}
  const def=kind==='slash'?CFG.slash:kind==='shockwave'?CFG.shockwave:CFG.fracture;
  player.action={kind,age:0,duration:def.duration,windup:def.windup,dir:player.dir,released:false};
  if(kind==='slash'){player.attackSerial++;player.attackT=def.duration}
  return true;
}
function doShockwave(){beginAction('shockwave')}
function doCrack(){beginAction('fracture')}
function releaseAction(a){
  const pose=humanoidPose(player.x,player.y,a.dir,player.walkT,false,player);
  if(a.kind==='slash'){
    spawnFX('slash',player.x+a.dir*9,player.y-76,{dir:a.dir,owner:player});
    spawnFX('afterimage',player.x,player.y,{dir:a.dir});
  }else{
    // Same front-foot socket as the bone pose, sampled at the actual contact frame.
    const origin={x:pose.frontFoot.x,y:groundY};
    spawnFX(a.kind==='shockwave'?'shockwave':'crack',origin.x,origin.y,{dir:a.dir});
    spawnDust(origin.x,origin.y-2,a.dir);
  }
}
function updateAction(dt){
  const a=player.action;if(!a)return;a.age+=dt;
  player.attackT=a.kind==='slash'?Math.max(0,a.duration-a.age):0;
  if(!a.released&&a.age>=a.windup){a.released=true;releaseAction(a)}
  if(a.age>=a.duration){player.action=null;player.attackT=0}
}
function damageEnemy(e,damage,dir,knockback=170,lift=120){
  if(e.dead)return;
  e.hp=Math.max(0,e.hp-damage);e.vx=dir*knockback;e.vy=-lift;e.onGround=false;e.hitFlash=.16;e.hitStun=.24;
  spawnFX('impact',e.x,e.y-58);
  if(e.hp<=0){e.dead=true;e.deathT=.65}
}
function doHeal(){
  player.hp=Math.min(player.maxHp,player.hp+20);
  spawnFX('heal',player.x,player.y-55);
}
function doProjectile(){
  spawnFX('projectile',player.x+player.dir*24,player.y-70,{dir:player.dir,vx:player.dir*420});
}
function spawnFX(type,x,y,extra={}){
  const durations={smoke:1.4,lightning:.28,slash:.34,shockwave:CFG.shockwave.travel,crack:CFG.fracture.life,dust:.75,heal:1.0,projectile:1.1,shieldHit:.42,afterimage:.28};
  const e={type,x,y,age:0,dur:durations[type]??.55,seed:++effectSerial*47.713,...extra};
  if(type==='crack'){e.geometry=fractureGeometry(e.seed,e.small);if(e.small)e.dur=1.35}
  if(type==='shockwave')e.hitIds=new Set();
  fx.push(e);return e;
}
function spawnEnemy(x=W+50){enemies.push({id:++enemySerial,x,y:groundY,vx:0,vy:0,dir:-1,onGround:true,hp:55,maxHp:55,hitFlash:0,hitStun:0,dead:false,deathT:0,seed:Math.random()*9999,lastHitSerial:-1,walkT:Math.random()*3})}
for(let i=0;i<4;i++)spawnEnemy(430+i*130);
function solveIK(hip,foot,L1,L2,bend){const dx=foot.x-hip.x,dy=foot.y-hip.y,d=Math.max(1,Math.min(L1+L2-0.001,Math.hypot(dx,dy))),a=Math.atan2(dy,dx),cosA=(L1*L1+d*d-L2*L2)/(2*L1*d),off=Math.acos(Math.max(-1,Math.min(1,cosA)))*bend;return{x:hip.x+Math.cos(a+off)*L1,y:hip.y+Math.sin(a+off)*L1}}
function humanoidPose(x,y,dir,walkT,isEnemy=false,entity=null){
  const moving=entity?Math.abs(entity.vx)>15:isEnemy;
  const a=entity?.action,standing=entity?entity.onGround:true,phase=walkT*9;
  const gait=moving&&!a?Math.sin(phase):0,bob=moving&&!a?Math.abs(Math.sin(phase))*2:Math.sin(t*2.6)*.5;
  let hipY=y-45-bob,chestY=y-84-bob,lean=0,frontLift=0,frontOffset=12,backOffset=-10;
  if(!standing){hipY+=2;chestY+=2}
  if(a&&a.kind==='slash'){
    const wind=smooth(0,a.windup,a.age),swing=smooth(a.windup,a.windup+.10,a.age),recover=smooth(.25,a.duration,a.age);
    lean=(-5*wind+13*swing)*(1-recover);hipY+=3*Math.sin(clamp(a.age/a.duration)*Math.PI);frontOffset=16;backOffset=-14;
  }else if(a){
    const wind=smooth(0,a.windup,a.age),settle=1-smooth(a.windup,a.duration,a.age);
    frontLift=a.age<a.windup?Math.sin(wind*Math.PI)*18:0;
    hipY+=7*wind*settle;chestY+=10*wind*settle;lean=7*wind*settle;frontOffset=18;backOffset=-13;
  }
  const hip={x:x+dir*lean*.25,y:hipY},chest={x:x+dir*lean,y:chestY},head={x:chest.x,y:chest.y-19};
  const stride=gait*15;
  const frontFoot={x:x+dir*(frontOffset+stride),y:y-(standing?Math.max(0,gait)*8:12)-frontLift};
  const backFoot={x:x+dir*(backOffset-stride),y:y-(standing?Math.max(0,-gait)*8:3)};
  const frontHip={x:hip.x+dir*3,y:hip.y},backHip={x:hip.x-dir*3,y:hip.y};
  function limb(root,end,L1,L2,bend){const dx=end.x-root.x,dy=end.y-root.y,d=Math.hypot(dx,dy)||1,r=Math.min(d,L1+L2-.01),tip={x:root.x+dx/d*r,y:root.y+dy/d*r};return{root,joint:solveIK(root,tip,L1,L2,bend),tip}}
  const frontLeg=limb(frontHip,frontFoot,25,25,-dir),backLeg=limb(backHip,backFoot,25,25,dir);
  const frontShoulder={x:chest.x+dir*4,y:chest.y+5},backShoulder={x:chest.x-dir*4,y:chest.y+5};
  let frontHand={x:chest.x+dir*(18+gait*10),y:chest.y+28},backHand={x:chest.x-dir*(17+gait*10),y:chest.y+28};
  if(a?.kind==='slash'){
    let angle;
    if(a.age<a.windup)angle=mix(.95,-1.38,smooth(0,a.windup,a.age));
    else angle=mix(-1.38,1.16,easeOut((a.age-a.windup)/.105));
    const recovery=smooth(.28,a.duration,a.age);angle=mix(angle,.95,recovery);
    frontHand={x:frontShoulder.x+dir*Math.cos(angle)*34,y:frontShoulder.y+Math.sin(angle)*34};

  }else if(a){frontHand={x:chest.x+dir*24,y:chest.y+19};backHand={x:chest.x-dir*25,y:chest.y+8}}

function render(dt){ctx.fillStyle='#f3f0e7';ctx.fillRect(0,0,W,H);drawGround();drawFX('ground');if(player.aura){for(let r=36;r<62;r+=10)scribbleCircle(player.x,player.y-56,r+Math.sin(t*3+r)*2,{loops:2,width:1,wobble:2,alpha:.13,seed:r+sketchFrame})}for(const e of enemies){if(e.dead){ctx.save();ctx.globalAlpha=clamp(e.deathT/.38);ctx.translate(e.x,e.y-20);ctx.rotate((.65-e.deathT)*2.2*e.dir);ctx.translate(-e.x,-(e.y-20));drawHumanoid(e.x,e.y,e.dir,e.walkT,0,true,e.seed,e);ctx.restore();continue}hatchRect(e.x-18,e.y+3,36,8,.5,.1,{seed:e.seed});drawHumanoid(e.x,e.y,e.dir,e.walkT,0,true,e.seed,e);const bw=34,bx=e.x-bw/2,by=e.y-130;ctx.strokeStyle='rgba(0,0,0,.45)';ctx.strokeRect(bx,by,bw,4);ctx.fillStyle='#3b2424';ctx.fillRect(bx+1,by+1,(bw-2)*Math.max(0,e.hp/e.maxHp),2)}
if(player.shield){
  const pulse=2+Math.sin(t*4)*2;
  sketchArc(player.x,player.y-58,43+pulse,-1.18,1.18,{seg:24,width:1.6,passes:3,alpha:.42,seed:740+sketchFrame,wobble:2.4});
  sketchArc(player.x,player.y-58,48-pulse,1.95,4.33,{seg:24,width:.9,passes:2,alpha:.18,seed:780+sketchFrame,wobble:3});
}
hatchRect(player.x-22,player.y+3,44,9,.55,.15,{seed:17});
drawHumanoid(player.x,player.y,player.dir,player.walkT,player.attackT,false,100,player);drawFX('front');}
function step(now){const realDt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;const dt=view.paused?0:realDt*view.timeScale;if(dt>0){t+=dt;sketchFrame=Math.floor(t*8);update(dt);updateEffects(dt)}render(0);requestAnimationFrame(step)}requestAnimationFrame(step);
addEventListener('keydown',event=>{
  const e={key:event.key.length===1?event.key.toLowerCase():event.key,repeat:event.repeat,target:event.target,preventDefault:()=>event.preventDefault()};
  if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','w','j','k','1','2','3','4','5','6','7','8','9'].includes(e.key))e.preventDefault();
  if(e.target instanceof HTMLElement&&e.target.tagName==='INPUT')return;
  keys.add(e.key.length===1?e.key.toLowerCase():e.key);
  if((e.key==='w'||e.key==='ArrowUp'||e.key===' ')&&!e.repeat)doJump();
  if(e.key==='j'&&!e.repeat)doAttack();
  if(e.key==='k'&&!e.repeat)doLightning();
  if(e.key==='1'&&!e.repeat)spawnFX('explosion',player.x+player.dir*65,player.y-55);
  if(e.key==='2'&&!e.repeat)spawnFX('smoke',player.x,player.y-20);
  if(e.key==='3'&&!e.repeat)player.aura=!player.aura;
  if(e.key==='4'&&!e.repeat)doAttack();
  if(e.key==='5'&&!e.repeat)doShockwave();
  if(e.key==='6'&&!e.repeat)doCrack();
  if(e.key==='7'&&!e.repeat)player.shield=!player.shield;
  if(e.key==='8'&&!e.repeat)doHeal();
  if(e.key==='9'&&!e.repeat)doProjectile();
});addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));
document.querySelectorAll('button').forEach(b=>b.addEventListener('pointerdown',e=>e.preventDefault()));
document.querySelectorAll('button[data-act]').forEach(b=>b.addEventListener('pointerdown',e=>{e.stopPropagation();const a=b.dataset.act;if(a==='jump')doJump();if(a==='attack')doAttack();if(a==='lightning')doLightning();if(a==='aura')player.aura=!player.aura;if(a==='slash')doAttack();if(a==='shockwave')doShockwave();if(a==='crack')doCrack()}));
const joy=document.getElementById('joy'),knob=document.getElementById('knob');function joyUpdate(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,L=Math.hypot(dx,dy),max=38;if(L>max){dx*=max/L;dy*=max/L}knob.style.transform=`translate(${dx}px,${dy}px)`;joyVec={x:dx/max,y:dy/max}}joy.addEventListener('pointerdown',e=>{joyActive=true;joy.setPointerCapture(e.pointerId);joyUpdate(e)});joy.addEventListener('pointermove',e=>{if(joyActive)joyUpdate(e)});joy.addEventListener('pointerup',()=>{joyActive=false;joyVec={x:0,y:0};knob.style.transform='translate(0,0)'});joy.addEventListener('pointercancel',()=>{joyActive=false;joyVec={x:0,y:0};knob.style.transform='translate(0,0)'});
function resetGame(){
  view.paused=false;const pauseButton=document.getElementById('pause');pauseButton.setAttribute('aria-pressed','false');pauseButton.textContent='일시정지';
  fx.length=0;enemies.length=0;keys.clear();spawnClock=0;
  Object.assign(player,{x:Math.min(180,W*.28),y:groundY,vx:0,vy:0,dir:1,onGround:true,hp:100,attackT:0,attackSerial:0,action:null,pendingGround:null,walkT:0,aura:false,shield:false});
  if(!view.practice)for(let i=0;i<4;i++)spawnEnemy(Math.max(player.x+220,W*.58)+i*130);
}
function clearInput(){keys.clear();joyActive=false;joyVec={x:0,y:0};knob.style.transform='translate(0,0)'}
addEventListener('blur',clearInput);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInput()});
document.getElementById('slow').addEventListener('click',e=>{view.timeScale=view.timeScale===1?.25:1;e.currentTarget.setAttribute('aria-pressed',String(view.timeScale!==1))});
document.getElementById('pause').addEventListener('click',e=>{view.paused=!view.paused;e.currentTarget.setAttribute('aria-pressed',String(view.paused));e.currentTarget.textContent=view.paused?'계속 재생':'일시정지';clearInput()});
document.getElementById('practice').addEventListener('click',e=>{view.practice=!view.practice;enemies.length=0;fx.length=0;spawnClock=0;if(!view.practice)for(let i=0;i<3;i++)spawnEnemy(Math.max(player.x+200,W*.6)+i*125);e.currentTarget.setAttribute('aria-pressed',String(view.practice));e.currentTarget.textContent=view.practice?'몹 다시 켜기':'몹 숨기기'});
document.getElementById('reset').addEventListener('click',resetGame);
window.__game={player,enemies,fx,view,update,updateEffects,render,doJump,doAttack,doLightning,doShockwave,doCrack,doHeal,doProjectile,spawnEnemy,spawnFX,resetGame,ground:()=>groundY,solveIK,humanoidPose};

})();
</script>
