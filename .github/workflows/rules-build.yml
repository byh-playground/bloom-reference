name: rules-build

# 규칙 Markdown(AGENTS.md, rules/*.md)이나 변환기가 바뀌면 위키 HTML을 다시 생성해 같은 브랜치에 커밋한다.
# 원본은 Markdown이고 rules/*.html은 생성물이다. 사람은 HTML을 직접 고치지 않는다.
on:
  push:
    paths:
      - "AGENTS.md"
      - "rules/*.md"
      - "tools/build-rules.py"
      - "tools/wiki-template.html"
      - "tools/requirements.txt"
      - ".github/workflows/rules-build.yml"

permissions:
  contents: write

concurrency:
  group: rules-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: 규칙 HTML 생성 (검사 실패 시 중단)
        run: python3 tools/build-rules.py
      - name: 생성물 커밋
        run: |
          git add rules/*.html
          if git diff --cached --quiet; then
            echo "생성물 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[build] 규칙 위키 HTML 재생성"
          git push
